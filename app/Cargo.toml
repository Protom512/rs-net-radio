[package]
name = "rs-net-radio"
version = "0.1.0"
edition = "2018"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
record-lib = { path = "../record-lib" }
tokio = { version = "1", features = ["full"] }
tokio-cron-scheduler = "0.15"
chrono = "0.4"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


