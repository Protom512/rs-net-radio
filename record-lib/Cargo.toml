[package]
name = "record-lib"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.0"
chrono = "0.4.42"
fs_extra = "1.3.0"
http = "1.3.1"
log = "0.4.17"
m3u8-rs = "6.0.0"
nom = "8.0.0"
reqwest = { version = "0.12.20", features = ["blocking","json"] }
scraper = "0.23.1"
serde = { version = "1.0.164", features = ["derive"] }
serde-xml-rs = "0.8.0"
serde_derive = "1.0.152"
serde_json = "1.0.96"
tempdir = "0.3.6"
tempfile = "3.5.0"
xml-rs = "0.8.4"

[dev-dependencies]
mockito = "1.7.0"
