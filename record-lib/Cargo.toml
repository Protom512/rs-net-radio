[package]
name = "record-lib"
version = "0.1.0"
edition = "2018"

[features]
backtrace = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22.0"
chrono = { version = "0.4.24", features = ["serde"] }
fs_extra = "1.3.0"
futures-util = "0.3"
http = "1.3.1"
log = "0.4.17"
m3u8-rs = "6.0.0"
regex = "1.10"
reqwest = { version = "0.12.20", features = ["blocking","json", "stream"] }
sanitize-filename = "0.6.0"
scraper = "0.20"
serde = { version = "1.0.228", features = ["derive"] }
serde-xml-rs = "0.8.0"
serde_json = "1.0.96"
tempdir = "0.3.6"
thiserror = "2.0.17"
tokio = { version = "1.45", features = ["full"] }
tokio-cron-scheduler = "0.15"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
mockito = "1.7.0"
env_logger = "0.9.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# もし env_logger を使うならここ
# env_logger = "0.10"
