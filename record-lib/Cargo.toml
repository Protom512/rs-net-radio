[package]
name = "record-lib"
version = "0.1.0"
edition = "2018"

[features]
backtrace = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
indicatif = "0.17"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs_extra = "1.3"
futures-util = "0.3"
http = "1"
log = "0.4"
m3u8-rs = "6"
regex = "1"
reqwest = { version = "0.13", features = ["blocking","json", "stream"] }
sanitize-filename = "0.6"
scraper = "0.25"
serde = { version = "1", features = ["derive"] }
serde-xml-rs = "0.8"
serde_json = "1"
tempdir = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-cron-scheduler = "0.15"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = "0.8"
mockito = "1.7"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "batch_benchmark"
harness = false

[[bench]]
name = "hibiki_bench"
harness = false
